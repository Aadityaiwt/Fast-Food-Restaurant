<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="icon" href="Images/fav-icon.png" type="image/png" />

    <style>
      body {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        background-color: black;
      }
      .outer {
        height: 700px;
        width: 500px;
        background-color: #cdab62;
        margin: 14px auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        border-radius: 10px;
      }

      h1 {
        text-align: center;
        font-size: 40px;
      }

      .btn-icon {
        height: 50px;
        width: 400px;
        border-radius: 10px;
        text-align: center;
        margin: 0 auto;
        border: none;
        cursor: pointer;
      }

      button img {
        height: 30px;
        width: 30px;
      }

      #btn {
        background-color: blue;
        font-size: 20px;
        cursor: pointer;
      }

      .divider {
        display: flex;
        align-items: center;
        width: 80%;
        margin: 20px 0;
      }

      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        border-bottom: 1px solid #ccc;
      }

      .divider span {
        margin: 0 10px;
        font-weight: bold;
        color: #555;
      }

      label {
        font-weight: 500;
      }

      input {
        height: 50px;
        width: 400px;
        border: none;
        border-radius: 10px;
        padding: 0 10px;
        box-sizing: border-box;
        font-size: 18px;
      }

      p {
        font-size: 18px;
        color: #000;
        text-align: center;
      }

      .margin {
        margin: 10px;
      }
    </style>
  </head>
  <body>
    <div class="outer">
      <h1 class="margin">Log In</h1>
      <div>
        <button class="btn-icon">
            <img src="./Images/google-icon.png" alt="google-icon" />
        </button>
      </div>
      <div class="divider">
        <span>OR</span>
      </div>
      <div class="form">
        <label for="email" id="email" class="margin">Email address</label><br />
        <input type="text" class="margin" /><br />
        <label for="password" id="password" class="margin">Password</label><br />
        <input type="password" class="margin" /> <br>
        <span class="margin" style="color: blue; cursor: pointer;">Forgot password?</span>
      </div>
      <button class="btn-icon margin" id="btn">Register</button>
      <p class="margin"><a href="">Can't Access Yout Account?</a></p>
      <p>
        Don't have an account?
        <a href="signin.html">Sign Up</a>
      </p>
    </div>
  </body>
</html>
